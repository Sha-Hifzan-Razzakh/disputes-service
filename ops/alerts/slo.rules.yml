      1e-9)
    labels:
      slo: api_availability
  - record: slo:api_availability:error_ratio_2h
    expr: (sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*",http_status_code=~"5.."}[2h]))) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*"}[2h])),
      1e-9)
    labels:
