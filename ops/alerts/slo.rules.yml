# GENERATED by ops/slo/slos.py — edit the SLOs there, then run it.
groups:
- name: slo-api_availability
  rules:
  - record: slo:api_availability:error_ratio_5m
    expr: (sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*",http_status_code=~"5.."}[5m]))) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*"}[5m])),
      1e-9)
    labels:
      slo: api_availability
  - record: slo:api_availability:error_ratio_30m
