  - record: slo:api_availability:error_ratio_6h
    expr: (sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*",http_status_code=~"5.."}[6h]))) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*"}[6h])),
      1e-9)
    labels:
      slo: api_availability
  - record: slo:api_availability:error_ratio_1d
    expr: (sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*",http_status_code=~"5.."}[1d]))) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*"}[1d])),
      1e-9)
    labels:
      slo: api_availability
  - record: slo:api_availability:error_ratio_3d
    expr: (sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*",http_status_code=~"5.."}[3d]))) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=~"/v2/.*"}[3d])),
      1e-9)
    labels:
      slo: api_availability
  - alert: SloBurn_api_availability_1h
    expr: slo:api_availability:error_ratio_1h > (14.4 * 0.005) and slo:api_availability:error_ratio_5m > (14.4 * 0.005)
    labels:
      severity: page
      slo: api_availability
    annotations:
      summary: '/v2 requests answered without a 5xx: error budget burning 14.4x (1h/5m windows)'
      runbook_url: https://github.com/Sha-Hifzan-Razzakh/disputes-service/blob/main/docs/runbook.md#slo-api-availability
  - alert: SloBurn_api_availability_6h
    expr: slo:api_availability:error_ratio_6h > (6.0 * 0.005) and slo:api_availability:error_ratio_30m > (6.0 * 0.005)
    labels:
      severity: page
      slo: api_availability
    annotations:
      summary: '/v2 requests answered without a 5xx: error budget burning 6.0x (6h/30m windows)'
      runbook_url: https://github.com/Sha-Hifzan-Razzakh/disputes-service/blob/main/docs/runbook.md#slo-api-availability
  - alert: SloBurn_api_availability_1d
    expr: slo:api_availability:error_ratio_1d > (3.0 * 0.005) and slo:api_availability:error_ratio_2h > (3.0 * 0.005)
    labels:
      severity: ticket
      slo: api_availability
    annotations:
      summary: '/v2 requests answered without a 5xx: error budget burning 3.0x (1d/2h windows)'
      runbook_url: https://github.com/Sha-Hifzan-Razzakh/disputes-service/blob/main/docs/runbook.md#slo-api-availability
  - alert: SloBurn_api_availability_3d
    expr: slo:api_availability:error_ratio_3d > (1.0 * 0.005) and slo:api_availability:error_ratio_6h > (1.0 * 0.005)
    labels:
      severity: ticket
      slo: api_availability
    annotations:
      summary: '/v2 requests answered without a 5xx: error budget burning 1.0x (3d/6h windows)'
