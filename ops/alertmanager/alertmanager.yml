# Alert routing (T25.8). severity=page -> on-call (PagerDuty); severity=ticket -> team channel. Every alert carries
# runbook_url (enforced by tests/unit/test_ops_config.py), which both receivers include in the notification.
# Credentials are files mounted from secrets, never inline.
global:
  resolve_timeout: 5m

route:
  receiver: team-channel
  group_by: [alertname, slo, tool, tenant]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: on-call
      group_wait: 10s
      repeat_interval: 1h
      continue: true          # pages also land in the channel, for the record
    - matchers: [severity=~"page|ticket"]
      receiver: team-channel

inhibit_rules:
  # a page already covers the same SLO's slower ticket alerts
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]

receivers:
  - name: on-call
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key
        description: '{{ .CommonAnnotations.summary }}'
        links:
          - href: '{{ .CommonAnnotations.runbook_url }}'
            text: runbook
  - name: team-channel
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#disputes-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }} — runbook: {{ .CommonAnnotations.runbook_url }}'
