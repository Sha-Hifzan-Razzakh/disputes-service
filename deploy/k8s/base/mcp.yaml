# The two MCP servers. In staging they are the in-repo reference servers; in prod they are the providers' own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels: {app.kubernetes.io/name: payments}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: payments}
  template:
    metadata:
      labels: {app.kubernetes.io/name: payments, role/mcp: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: payments
          image: disputes-service
          imagePullPolicy: IfNotPresent
          args: ["uvicorn", "mcp_servers.payments:app", "--host", "0.0.0.0", "--port", "8101"]
          ports: [{name: mcp, containerPort: 8101}]
          env:
            - name: MCP_PAYMENTS_TOKEN
              valueFrom: {secretKeyRef: {name: mcp-secrets, key: payments-token}}
          readinessProbe: {tcpSocket: {port: mcp}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: mcp}, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector: {app.kubernetes.io/name: payments}
  ports: [{name: mcp, port: 8101, targetPort: mcp}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-gateway
  labels: {app.kubernetes.io/name: network-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: network-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: network-gateway, role/mcp: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: network-gateway
          image: disputes-service
          imagePullPolicy: IfNotPresent
          args: ["uvicorn", "mcp_servers.network_gateway:app", "--host", "0.0.0.0", "--port", "8102"]
          ports: [{name: mcp, containerPort: 8102}]
          env:
            - name: MCP_NETWORK_TOKEN
              valueFrom: {secretKeyRef: {name: mcp-secrets, key: network-token}}
          readinessProbe: {tcpSocket: {port: mcp}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: mcp}, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: network-gateway
spec:
  selector: {app.kubernetes.io/name: network-gateway}
  ports: [{name: mcp, port: 8102, targetPort: mcp}]
