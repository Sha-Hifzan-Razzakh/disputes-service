apiVersion: batch/v1
kind: CronJob
metadata:
  name: prune-checkpoints
spec:
  schedule: "17 2 * * *"                 # daily retention (APP_CHECKPOINT_RETENTION_DAYS)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {app.kubernetes.io/name: prune-checkpoints, egress/postgres: "true"}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: prune
              image: disputes-service
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/prune_checkpoints.py"]
              envFrom:
                - configMapRef: {name: app-config}
                - secretRef: {name: app-secrets}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: synthetic
spec:
  schedule: "*/5 * * * *"                # synthetic request through the Service (T25.4); a failed Job alerts
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels: {app.kubernetes.io/name: synthetic, egress/api: "true"}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: synthetic
              image: disputes-service
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/synthetic.py", "--base", "http://api"]
              env:
                - name: APP_JWT_SECRET
                  valueFrom: {secretKeyRef: {name: app-secrets, key: APP_JWT_SECRET}}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
