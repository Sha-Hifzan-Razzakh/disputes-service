apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: disputes-staging
resources: [../../../migrate]
components: [../env]
patches:
  - target: {kind: Job, name: migrate}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: ["sh", "-c", "alembic upgrade head && python scripts/checkpoint_setup.py && python -m seeds.load"]
