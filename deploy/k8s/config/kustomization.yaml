# Non-secret settings (APP_*). Overlays patch the values that differ per environment (docs/environments.md).
# Generated with a content hash in the name: a config change rolls the pods, and `rollout undo` brings back
# the old config together with the old ReplicaSet (review of PR #14). Old ConfigMaps stay until pruned.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=staging
      - APP_CHECKPOINT_AUTO_SETUP=false
      - APP_TOOLS_ENABLED=true
      - APP_MCP_PAYMENTS_URL=http://payments:8101/mcp
      - APP_MCP_NETWORK_URL=http://network-gateway:8102/mcp
      - APP_MODEL_PROVIDER=rules
      - APP_DB_POOL_SIZE=8
      - APP_DB_MAX_OVERFLOW=4
      - APP_MAX_CONCURRENT_RUNS=8
      - APP_CHECKPOINT_POOL_MAX=4
      - APP_SWEEPER_ENABLED=true
      - APP_OTEL_EXPORTER=none
      - LANGGRAPH_STRICT_MSGPACK=true
