name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app seeds scripts mcp_servers evals
      - run: uv run lint-imports
      - run: uv run pytest -q --cov --cov-report=term --cov-report=xml
        env:
          APP_TEST_DSN: postgresql://postgres@localhost:5432

  evals:
    # Golden set through the real graph, Postgres and in-memory MCP servers (rules drafter, deterministic).
    # Fails on a threshold or on a regression against the newest evals/baselines/*.json (T17.6).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m evals.run
        env:
          APP_TEST_DSN: postgresql://postgres@localhost:5432
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  security:
    # bandit (code), pip-audit (locked runtime deps), gitleaks (full history; allowlist in .gitleaks.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx bandit==1.8.6 -r app mcp_servers -ll
      - run: |
          uv export --frozen --no-dev -q -o requirements.txt
          uvx pip-audit==2.9.0 -r requirements.txt --disable-pip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # build -> scan -> run the whole compose stack -> probe readiness and the MCP servers over HTTP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: disputes-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8  # v0.33.1
        with:
          image-ref: disputes-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker compose up -d --build
      - name: readiness
        run: |
          for i in $(seq 1 45); do curl -fsS localhost:8000/readyz && exit 0; sleep 2; done
          docker compose ps; docker compose logs --tail 80; exit 1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: MCP servers over HTTP with the production client
        run: uv run python scripts/smoke_tools.py
        env:
          APP_MCP_PAYMENTS_TOKEN: dev-payments-token
          APP_MCP_NETWORK_TOKEN: dev-network-token
      - if: always()
        run: docker compose down -v
