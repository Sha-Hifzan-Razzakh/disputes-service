[project]
name = "disputes-service"
version = "1.4.0"
description = "Multi-tenant card-payment dispute (chargeback) service with a LangGraph dispute assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.9",
    "langchain-core>=1.7.4",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"seeds/data.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
